# The check every change goes through: pull requests, main and ci-* branches. One workflow, one
# result: `tests-ok` is the check the main ruleset requires. It is green when every job that had something to check passed;
# jobs with nothing to check (a docs-only change) are skipped, not red, so a required check
# never hangs waiting for a run that a path filter swallowed.
#
# What runs is decided per job by the `changes` job (dorny/paths-filter), not by a workflow
# level `paths:`. That way the workflow always reports, and a change to api/ alone does not
# spend four minutes building the frontend.
#
# A push to main that passes goes on to `publish` (images by digest), `deploy-staging` and
# `deploy-production` (docs/BRINDLE_DEPLOY.md). Pull requests never reach those jobs or their
# secrets.
#
# Every run writes its numbers (tests and coverage per app area, slowest tests, runtime) to the
# job summary through scripts/ci/test-report.mjs and keeps them as the `test-stats` artifact.
name: Tests

on:
  pull_request:
  push:
    branches: [main, 'ci-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR or branch. A newer push cancels an older pull-request run, but never a branch
  # run: that one may be deploying, and a deploy cut off halfway helps nobody. Branch runs queue.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The images are node:22-alpine (web/Dockerfile, api/Dockerfile): CI matches production.
  NODE_VERSION: 22
  FORCE_COLOR: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.f.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      api: ${{ steps.f.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
      mcp: ${{ steps.f.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch' }}
      images: ${{ steps.f.outputs.images == 'true' || github.event_name == 'workflow_dispatch' }}
      deploy: ${{ steps.f.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch' }}
      catalogue: ${{ steps.f.outputs.catalogue == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          # A push compares with the commit before it (its own branch), not with main: stores and
          # watch are hundreds of commits ahead of main, so against main everything "changed" and
          # every job ran on every push. Pull requests compare with their base, as always.
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            frontend:
              - '.github/workflows/test.yml'
              - 'scripts/ci/**'
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/scripts/**'
              - 'frontend/index.html'
              - 'frontend/vite.config.js'
              - 'frontend/package*.json'
              # The phone build and the Coach import the api's shared core.
              - 'api/coach/core/**'
              - 'api/coach/prompts/**'
              - 'api/sync-stamps.js'
              - 'api/nudge-copy.js'
              - 'api/server.js'
              - 'api/test/fixtures/**'
              - 'catalogue/**'
              - 'scripts/build-coach-*.mjs'
              - 'web/Dockerfile'
            api:
              - '.github/workflows/test.yml'
              - 'scripts/ci/**'
              - 'api/**'
              - 'website/api.html'
              - 'scripts/build-api-docs.mjs'
              - 'website/*.html'
              - 'scripts/build-coach-*.mjs'
              - 'catalogue/**'
              - 'frontend/src/lib/**'
              - 'frontend/src/locales/**'
            mcp:
              - '.github/workflows/test.yml'
              - 'scripts/ci/**'
              - 'mcp/**'
              - 'frontend/src/lib/**'
            images:
              - '.github/workflows/test.yml'
              - 'api/Dockerfile'
              - 'api/package*.json'
              - 'api/*.js'
              - 'api/coach/**'
              - 'web/**'
              - 'frontend/package*.json'
              - 'frontend/vite.config.js'
            deploy:
              - '.github/workflows/test.yml'
              - '.github/workflows/promote.yml'
              - '.github/workflows/deploy.yml'
              - 'deploy/**'
              - 'scripts/deploy/**'
            catalogue:
              - '.github/workflows/test.yml'
              - 'catalogue/**'
              - 'scripts/catalogue/**'
              - 'frontend/src/lib/exercises-data.js'
              - 'frontend/src/instr/**'
              - 'frontend/src/exercise-names/**'
              - 'frontend/src/exercise-desc/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: nothing the tests or the web build need runs an install script.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      # Unit + component suite with v8 coverage and a JSON report for the stats step. No
      # retries: a test that only passes the second time is a bug. Order, time zone and clock
      # are shaken weekly in audit.yml.
      - name: Unit and component tests
        working-directory: frontend
        run: >
          npx vitest run
          --reporter=default --reporter=json --outputFile.json=test-results.json
          --reporter=junit --outputFile.junit=junit.xml
          --coverage --coverage.provider=v8 --coverage.include='src/**'
          --coverage.reporter=json-summary --coverage.reporter=text-summary
      # A broken import or bad JSX fails the build long before any test covers it.
      - name: Web build
        run: npm run build
        working-directory: frontend
      - name: Bundle size
        run: node scripts/bundle-size.mjs --out bundle-size.json
        working-directory: frontend
      - name: Locale packs are in sync
        run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only (a known backlog of demo strings).
      - name: Untranslated strings in src (report only)
        run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - name: Fatigue model property probe
        run: npm run test:fatigue-probe
        working-directory: frontend
      - name: Stats
        if: always()
        run: >
          node scripts/ci/test-report.mjs --label Frontend --root frontend
          --vitest frontend/test-results.json --coverage frontend/coverage/coverage-summary.json
          --bundle frontend/bundle-size.json --out stats/frontend.json
      # Tests without an assertion, duplicated tests, tests that read source text: report only.
      - name: Test audit
        if: always()
        run: node scripts/ci/test-audit.mjs frontend/src frontend/scripts api/test mcp/test > /dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: stats-frontend
          path: |
            stats/frontend.json
            frontend/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            package-lock.json
      # The Coach tests drive the in-repo fixture provider and a local mock of the Chat
      # Completions shape: no AI account, no network. The Agent SDK is optional and stays out.
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - name: API tests
        working-directory: api
        run: >
          node --test --experimental-test-coverage
          --test-coverage-exclude='test/**' --test-coverage-exclude='node_modules/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=../scripts/ci/node-test-reporter.mjs --test-reporter-destination=test-results.jsonl
          --test-reporter=lcov --test-reporter-destination=lcov.info
          --test-reporter=junit --test-reporter-destination=junit.xml
          test/*.test.js
      # The api's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would surface as "the Coach can't find that exercise".
      - name: Generated Coach assets are current
        run: node scripts/build-coach-assets.mjs --check
      # website/api.html is generated from api/openapi.yaml and committed. Same reason.
      - run: npm ci --no-audit --no-fund
      - name: Generated API docs are current
        run: node scripts/build-api-docs.mjs --check
      - name: Coach core loads in plain node
        run: node api/scripts/check-core-loadable.mjs
      - name: Stats
        if: always()
        run: >
          node scripts/ci/test-report.mjs --label API --root api
          --node api/test-results.jsonl --lcov api/lcov.info --out stats/api.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: stats-api
          path: |
            stats/api.json
            api/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mcp/package-lock.json
            api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      # log_workout's end-to-end test drives the real api/server.js, so the api's own
      # dependencies are here too (same install as the api job). Without them that test fails
      # under CI rather than skipping, so a green run means it ran.
      - run: npm ci --no-audit --no-fund --omit=optional
        working-directory: api
      - name: MCP tests
        working-directory: mcp
        run: >
          npx vitest run
          --reporter=default --reporter=json --outputFile.json=test-results.json
          --coverage --coverage.provider=v8 --coverage.reporter=json-summary
      # The one check the vitest suite structurally cannot make: the MCP server is a bare node
      # process, but vitest resolves import.meta.glob, .jsx and ?raw happily. That is how a
      # Vite-only import reached a shared module with 33 green tests over a dead server.
      - name: Server loads in plain node
        run: npm run check:node-loadable
        working-directory: mcp
      - name: Stats
        if: always()
        run: >
          node scripts/ci/test-report.mjs --label MCP --root mcp
          --vitest mcp/test-results.json --coverage mcp/coverage/coverage-summary.json --out stats/mcp.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: stats-mcp
          path: stats/mcp.json
          retention-days: 30
          if-no-files-found: ignore

  # Was its own workflow (catalogue.yml); here it reports into the one required check.
  catalogue:
    needs: changes
    if: needs.changes.outputs.catalogue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate the catalogue
        run: node scripts/catalogue/validate.mjs
      - name: Generated files are up to date
        run: node scripts/catalogue/build.mjs --check
      - name: Media stay within 180 px (licence)
        run: node scripts/catalogue/check-media.mjs

  # Builds *and runs* the api image targets and the web image. Building alone would not have
  # caught the api image shipping without coach/: that image built perfectly and exited on boot.
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layers cached between runs (GitHub cache), loaded into the local engine to be started.
      - name: api, default target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          target: default
          load: true
          tags: opengym-api:default
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: api, coach target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          target: coach
          load: true
          tags: opengym-api:coach
          cache-from: type=gha,scope=ci-api-coach
          cache-to: type=gha,mode=max,scope=ci-api-coach
      # No target, exactly like docker-publish.yml: what that workflow ships is whatever stage
      # is last, and that untargeted image is what every self-hoster pulls as :latest.
      - name: api, as published
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          load: true
          tags: opengym-api:published
          cache-from: type=gha,scope=ci-api
      - name: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          tags: opengym-web:ci
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web

      - name: the image published as :latest has no AI runtime either
        run: |
          docker run --rm opengym-api:published node -e \
            'import("@anthropic-ai/claude-agent-sdk").then(()=>{console.error("AI runtime present in the published image -- the last Dockerfile stage is no longer the runtime-free one");process.exit(1)},()=>process.exit(0))'
          ! docker run --rm opengym-api:published codex --version
          ! docker run --rm opengym-api:published bwrap --version

      - name: the default image boots and serves, with no AI runtime in it
        run: |
          docker network create og
          docker run -d --name api-default --network og --network-alias api -e DATA_DIR=/data -p 3000:3000 opengym-api:default
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/config >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/config | tee /dev/stderr | grep -q '"invite_only"'
          docker run --rm opengym-api:default node -e \
            'import("@anthropic-ai/claude-agent-sdk").then(()=>{console.error("AI runtime present in the default image");process.exit(1)},()=>process.exit(0))'

      # The stack the way docker-compose.yml wires it: nginx in the web image proxies /api to
      # the api container. A green api image and a green web image can still not talk.
      - name: the web image serves the app and reaches the api through nginx
        run: |
          docker run -d --name web --network og -p 8080:80 opengym-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS http://localhost:8080/api/config | grep -q '"invite_only"'
          docker rm -f web api-default

      - name: the coach image carries a runnable Agent SDK
        run: |
          docker run --rm opengym-api:coach node --input-type=module -e '
            const { adapterFor } = await import("./coach/adapters/index.js");
            const r = await adapterFor("claude").check();
            if (!r.ok) { console.error(r.error); process.exit(1); }
            console.log(r.version);
          '

      - name: the coach image carries the Codex runtime and its sandbox
        run: |
          docker run --rm opengym-api:coach codex --version
          docker run --rm opengym-api:coach bwrap --version
          # Owned by the user jobs drop to, and 0700: a credential cache readable by anything
          # else in the container would undo the point of dropping privileges at all.
          test "$(docker run --rm opengym-api:coach stat -c '%U %a' /coach-auth)" = "coach 700"

      - name: neither Codex nor its sandbox is in the default image
        run: |
          ! docker run --rm opengym-api:default codex --version 2>/dev/null
          ! docker run --rm opengym-api:default bwrap --version 2>/dev/null

      - name: the privilege drop can actually be performed in the image
        run: |
          # canDropPrivileges() fails closed, so a missing `coach` user disables every job,
          # including the fixture provider.
          docker run --rm opengym-api:default id coach

  # The deploy tooling: unit tests for scripts/deploy, and both environments' Coolify compose
  # rendered from a dummy release and checked by compose itself.
  deploy-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test "scripts/deploy/*.test.mjs"
      - name: The deploy scripts parse and pass shellcheck
        run: shellcheck -S warning deploy/*.sh scripts/deploy/*.sh
      - name: Both environments render to a valid compose file
        run: |
          d=$(head -c 64 /dev/zero | tr '\0' a)
          printf '{"sha":"%s","api":"ghcr.io/brindlehq/opengym-api@sha256:%s","web":"ghcr.io/brindlehq/opengym-web@sha256:%s"}' \
            "$(head -c 40 /dev/zero | tr '\0' 0)" "$d" "$d" > dummy-release.json
          for env in staging production; do
            node scripts/deploy/coolify.mjs render "$env" dummy-release.json > "compose-$env.yml"
            docker compose -f "compose-$env.yml" config -q
            echo "$env: ok"
          done

  # What our two images ship has no high or critical advisory: the web bundle's and the API's
  # runtime dependencies, without the optional Coach SDK, which the image we deploy leaves out
  # (npm ci --omit=optional in api/Dockerfile). The weekly audit.yml checks the wider picture,
  # dev tooling, the Coach SDK and mcp/ included, on its own schedule outside this gate.
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: api runtime (as in the image)
        working-directory: api
        run: npm audit --omit=dev --omit=optional --audit-level=high
      - name: web bundle runtime
        working-directory: frontend
        run: npm audit --omit=dev --omit=optional --audit-level=high

  # One summary of the numbers of every suite that ran.
  report:
    needs: [frontend, api, mcp]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: stats-*
          merge-multiple: true
          path: dl
      - name: Test report
        run: |
          set -- $(find dl -name '*.json' | sort)
          if [ $# -eq 0 ]; then echo "Nothing was tested in this run (no matching changes)." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node scripts/ci/test-report.mjs --combine "$@" --out combined.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-stats
          path: combined.json
          retention-days: 90
          if-no-files-found: ignore

  # The single required check. Green when every job that ran passed and the others were
  # skipped because nothing they check changed.
  tests-ok:
    needs: [changes, frontend, api, mcp, catalogue, images, deploy-config, deps-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or had nothing to check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            const n = JSON.parse(require("fs").readFileSync(0, "utf8"))
            for (const [k, v] of Object.entries(n)) console.log(k.padEnd(10), v.result)
            const bad = Object.entries(n).filter(([, v]) => !["success", "skipped"].includes(v.result))
            if (bad.length) { console.log("::error::" + bad.map(([k, v]) => k + ": " + v.result).join(", ")); process.exit(1) }'

  # The release candidate: built once from this commit after tests-ok, pushed to GHCR, then
  # pulled back by digest and smoke-tested. release.json names the two images by digest; every
  # later step (staging, production, rollback) deploys exactly those, nothing is rebuilt.
  # Pushes to this repository only: a pull request, or a fork, never gets here.
  publish:
    needs: tests-ok
    # !cancelled() and the explicit result, not the implicit success(): that one also needs every
    # job upstream of tests-ok to have run, and the path filter skips some on most pushes.
    if: >-
      !cancelled() && needs.tests-ok.result == 'success' &&
      github.event_name == 'push' && github.repository == 'BrindleHQ/openGym' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version metadata
        id: v
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # The source label is what links the package to this repository on GHCR (and overrides the
      # upstream one in the Dockerfiles). Untargeted on purpose: the last stage is the image
      # without any AI runtime, the one the images job checks.
      - name: api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/brindlehq/opengym-api:sha-${{ github.sha }}
          build-args: |
            VERSION=sha-${{ steps.v.outputs.short }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/BrindleHQ/openGym
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ci-api
      - name: web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/brindlehq/opengym-web:sha-${{ github.sha }}
          build-args: |
            APP_BUILD=${{ steps.v.outputs.short }}
            VERSION=sha-${{ steps.v.outputs.short }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/BrindleHQ/openGym
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ci-web
      - name: Release record
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          node -e '
            const e = process.env
            const r = { sha: e.GITHUB_SHA, api: "ghcr.io/brindlehq/opengym-api@" + e.API_DIGEST,
              web: "ghcr.io/brindlehq/opengym-web@" + e.WEB_DIGEST, run_id: e.GITHUB_RUN_ID,
              run_attempt: e.GITHUB_RUN_ATTEMPT, ref: e.GITHUB_REF, built: new Date().toISOString() }
            require("fs").writeFileSync("release.json", JSON.stringify(r, null, 2) + "\n")
            console.log(JSON.stringify(r, null, 2))'
      - name: Smoke-test the pushed images by digest
        run: scripts/deploy/smoke.sh release.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: release.json
          retention-days: 90
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "### Release candidate ${GITHUB_SHA::7}"
            echo '```json'; cat release.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Every green push to main goes to staging, then, if staging took it, to production: the
  # same release, nothing rebuilt (the T3 Code pattern: main is what runs). Each environment's
  # SSH key is its own environment secret, usable from main only. Rollback is one command on
  # Boop Beep, not a pipeline run (docs/BRINDLE_DEPLOY.md).
  deploy-staging:
    needs: publish
    if: >-
      !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit

  deploy-production:
    needs: deploy-staging
    if: >-
      !cancelled() && needs.deploy-staging.result == 'success' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ github.sha }}
    secrets: inherit
